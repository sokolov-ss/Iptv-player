<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>IPTV Player — Прототип</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <style>
    :root {
      --bg: #0f0f13;
      --surface: #1a1a22;
      --surface2: #252530;
      --border: #2e2e3a;
      --text: #f0f0f5;
      --text2: #a0a0b0;
      --accent: #6c5ce7;
      --accent-hover: #7f71ef;
      --danger: #e74c3c;
      --success: #2ecc71;
      --radius: 12px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    .app {
      display: grid;
      grid-template-columns: 340px 1fr;
      height: 100vh;
    }

    /* ===== SIDEBAR ===== */
    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .logo {
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo span {
      background: linear-gradient(135deg, #6c5ce7, #a29bfe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .add-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .add-btn:hover {
      background: var(--accent-hover);
    }

    .search-box {
      position: relative;
    }

    .search-box input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px 10px 36px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    .search-box::before {
      content: "🔍";
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      opacity: 0.6;
    }

    .playlist-tabs {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .playlist-tab {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text2);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
    }

    .playlist-tab.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .channels {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .channel {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .channel:hover {
      background: var(--surface2);
    }

    .channel.active {
      background: rgba(108, 92, 231, 0.2);
      border: 1px solid rgba(108, 92, 231, 0.4);
    }

    .channel-logo {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: var(--surface2);
      object-fit: contain;
      flex-shrink: 0;
    }

    .channel-info {
      flex: 1;
      min-width: 0;
    }

    .channel-name {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .channel-group {
      font-size: 11px;
      color: var(--text2);
      margin-top: 2px;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text2);
      text-align: center;
      padding: 24px;
      gap: 12px;
    }

    .empty-state .icon {
      font-size: 48px;
      opacity: 0.4;
    }

    /* ===== PLAYER AREA ===== */
    .player-area {
      display: flex;
      flex-direction: column;
      background: #000;
      position: relative;
    }

    .video-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      max-height: 100%;
      object-fit: contain;
      background: #000;
    }

    .player-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.6);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .player-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .now-playing {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(transparent, rgba(0,0,0,0.85));
      padding: 40px 20px 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .now-playing-info h2 {
      font-size: 18px;
      font-weight: 600;
    }

    .now-playing-info p {
      font-size: 13px;
      color: var(--text2);
      margin-top: 4px;
    }

    .player-controls {
      display: flex;
      gap: 8px;
    }

    .ctrl-btn {
      background: rgba(255,255,255,0.15);
      border: none;
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .ctrl-btn:hover {
      background: rgba(255,255,255,0.25);
    }

    /* ===== MODAL ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: var(--surface);
      border-radius: 16px;
      width: 90%;
      max-width: 420px;
      padding: 24px;
      border: 1px solid var(--border);
    }

    .modal h3 {
      font-size: 18px;
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      color: var(--text2);
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 11px 14px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    .form-group input:focus {
      border-color: var(--accent);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn {
      flex: 1;
      padding: 11px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--border);
    }

    .status {
      font-size: 13px;
      margin-top: 10px;
      min-height: 18px;
    }

    .status.error {
      color: var(--danger);
    }

    .status.success {
      color: var(--success);
    }

    .status.loading {
      color: var(--text2);
    }

    /* ===== MOBILE ===== */
    @media (max-width: 768px) {
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 45vh;
      }

      .sidebar {
        order: 2;
        border-right: none;
        border-top: 1px solid var(--border);
      }

      .player-area {
        order: 1;
      }

      .sidebar-header {
        padding: 12px;
      }

      .logo {
        font-size: 16px;
      }
    }

    /* Scrollbar */
    .channels::-webkit-scrollbar {
      width: 6px;
    }
    .channels::-webkit-scrollbar-track {
      background: transparent;
    }
    .channels::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">📺 <span>IPTV Player</span></div>
        <button class="add-btn" onclick="openModal()">＋ Добавить плейлист</button>
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Поиск каналов..." oninput="filterChannels()" />
        </div>
        <div class="playlist-tabs" id="playlistTabs"></div>
      </div>
      <div class="channels" id="channelsList">
        <div class="empty-state">
          <div class="icon">📡</div>
          <div>Добавьте плейлист,<br>чтобы начать смотреть</div>
        </div>
      </div>
    </aside>

    <!-- PLAYER -->
    <main class="player-area">
      <div class="video-container">
        <video id="video" controls playsinline webkit-playsinline allowfullscreen></video>
        <div class="player-overlay visible" id="overlay">
          <div style="text-align:center; color:#aaa;">
            <div style="font-size:48px; margin-bottom:12px;">▶️</div>
            <div>Выберите канал</div>
          </div>
        </div>
      </div>
      <div class="now-playing" id="nowPlaying" style="display:none;">
        <div class="now-playing-info">
          <h2 id="currentName">—</h2>
          <p id="currentGroup">—</p>
        </div>
      </div>
    </main>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h3>Добавить плейлист</h3>
      <div class="form-group">
        <label>Название (необязательно)</label>
        <input type="text" id="playlistName" placeholder="Мой плейлист" />
      </div>
      <div class="form-group">
        <label>Ссылка на M3U / M3U8</label>
        <input type="url" id="playlistUrl" placeholder="https://example.com/playlist.m3u" />
      </div>
      <div class="status" id="modalStatus"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal()">Отмена</button>
        <button class="btn btn-primary" onclick="addPlaylist()">Добавить</button>
      </div>
    </div>
  </div>

  <script>
    // ========== STATE ==========
    let playlists = JSON.parse(localStorage.getItem('iptv_playlists') || '[]');
    let currentPlaylistId = localStorage.getItem('iptv_current') || null;
    let channels = [];
    let currentChannel = null;
    let hls = null;
    let lastChannelUrl = localStorage.getItem('iptv_last_channel') || null;

    // ========== INIT ==========
    function init() {
      renderPlaylistTabs();
      if (currentPlaylistId) {
        const pl = playlists.find(p => p.id === currentPlaylistId);
        if (pl) {
          channels = pl.channels || [];
          renderChannels();

          // Автовоспроизведение последнего канала
          if (lastChannelUrl) {
            const idx = channels.findIndex(ch => ch.url === lastChannelUrl);
            if (idx !== -1) {
              setTimeout(() => playChannel(idx, true), 400);
            }
          }
        }
      }
    }

    // ========== MODAL ==========
    function openModal() {
      document.getElementById('modal').classList.add('open');
      document.getElementById('playlistUrl').value = '';
      document.getElementById('playlistName').value = '';
      document.getElementById('modalStatus').textContent = '';
      document.getElementById('modalStatus').className = 'status';
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('open');
    }

    // ========== M3U PARSER ==========
    function parseM3U(text) {
      const lines = text.split(/\r?\n/);
      const result = [];
      let current = null;

      for (let line of lines) {
        line = line.trim();
        if (!line) continue;

        if (line.startsWith('#EXTINF:')) {
          current = { name: 'Unknown', logo: '', group: '', url: '' };

          // Extract duration and attributes
          const commaIndex = line.indexOf(',');
          if (commaIndex !== -1) {
            current.name = line.substring(commaIndex + 1).trim();
          }

          // tvg-logo
          const logoMatch = line.match(/tvg-logo="([^"]*)"/i);
          if (logoMatch) current.logo = logoMatch[1];

          // group-title
          const groupMatch = line.match(/group-title="([^"]*)"/i);
          if (groupMatch) current.group = groupMatch[1];

        } else if (line.startsWith('#EXTGRP:')) {
          if (current) current.group = line.substring(8).trim();
        } else if (!line.startsWith('#') && current) {
          current.url = line;
          result.push(current);
          current = null;
        }
      }
      return result;
    }

    // ========== ADD PLAYLIST ==========
    async function addPlaylist() {
      const url = document.getElementById('playlistUrl').value.trim();
      const name = document.getElementById('playlistName').value.trim() || 'Плейлист';
      const status = document.getElementById('modalStatus');

      if (!url) {
        status.textContent = 'Введите ссылку';
        status.className = 'status error';
        return;
      }

      status.textContent = 'Загрузка...';
      status.className = 'status loading';

      try {
        let text;
        try {
          const res = await fetch(url);
          if (!res.ok) throw new Error('HTTP ' + res.status);
          text = await res.text();
        } catch (e) {
          // Fallback via public CORS proxy
          const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url);
          const res2 = await fetch(proxyUrl);
          if (!res2.ok) throw new Error('Не удалось загрузить плейлист (CORS или ссылка недоступна)');
          text = await res2.text();
        }

        const parsed = parseM3U(text);
        if (parsed.length === 0) {
          throw new Error('В плейлисте не найдено каналов');
        }

        const playlist = {
          id: Date.now().toString(),
          name: name,
          url: url,
          channels: parsed,
          addedAt: new Date().toISOString()
        };

        playlists.push(playlist);
        localStorage.setItem('iptv_playlists', JSON.stringify(playlists));

        currentPlaylistId = playlist.id;
        localStorage.setItem('iptv_current', currentPlaylistId);
        channels = parsed;

        renderPlaylistTabs();
        renderChannels();
        closeModal();

      } catch (err) {
        status.textContent = err.message || 'Ошибка загрузки';
        status.className = 'status error';
        console.error(err);
      }
    }

    // ========== RENDER ==========
    function renderPlaylistTabs() {
      const container = document.getElementById('playlistTabs');
      if (playlists.length === 0) {
        container.innerHTML = '';
        return;
      }
      container.innerHTML = playlists.map(p => `
        <div class="playlist-tab ${p.id === currentPlaylistId ? 'active' : ''}"
             onclick="selectPlaylist('${p.id}')">
          ${escapeHtml(p.name)} (${p.channels.length})
        </div>
      `).join('');
    }

    function selectPlaylist(id) {
      currentPlaylistId = id;
      localStorage.setItem('iptv_current', id);
      const pl = playlists.find(p => p.id === id);
      channels = pl ? pl.channels : [];
      renderPlaylistTabs();
      renderChannels();
    }

    function renderChannels(filter = '') {
      const container = document.getElementById('channelsList');
      const q = filter.toLowerCase();

      const filtered = channels.filter(ch =>
        ch.name.toLowerCase().includes(q) ||
        (ch.group || '').toLowerCase().includes(q)
      );

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="icon">🔍</div>
            <div>${channels.length === 0 ? 'Нет каналов' : 'Ничего не найдено'}</div>
          </div>`;
        return;
      }

      container.innerHTML = filtered.map((ch, i) => `
        <div class="channel ${currentChannel && currentChannel.url === ch.url ? 'active' : ''}"
             onclick="playChannel(${channels.indexOf(ch)})">
          <img class="channel-logo" src="${ch.logo || ''}"
               onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 40 40%22><rect fill=%22%23252530%22 width=%2240%22 height=%2240%22 rx=%228%22/><text x=%2220%22 y=%2225%22 text-anchor=%22middle%22 fill=%22%23666%22 font-size=%2216%22>📺</text></svg>'"
               alt="">
          <div class="channel-info">
            <div class="channel-name">${escapeHtml(ch.name)}</div>
            <div class="channel-group">${escapeHtml(ch.group || 'Без категории')}</div>
          </div>
        </div>
      `).join('');
    }

    function filterChannels() {
      const q = document.getElementById('searchInput').value;
      renderChannels(q);
    }

    // ========== PLAYER ==========
    function playChannel(index, isAuto = false) {
      const ch = channels[index];
      if (!ch) return;

      currentChannel = ch;
      lastChannelUrl = ch.url;
      localStorage.setItem('iptv_last_channel', ch.url);

      renderChannels(document.getElementById('searchInput').value);

      const video = document.getElementById('video');
      const overlay = document.getElementById('overlay');
      const nowPlaying = document.getElementById('nowPlaying');

      document.getElementById('currentName').textContent = ch.name;
      document.getElementById('currentGroup').textContent = ch.group || '';
      nowPlaying.style.display = 'flex';
      overlay.classList.remove('visible');

      if (hls) {
        hls.destroy();
        hls = null;
      }

      video.removeAttribute('src');
      video.load();

      const url = ch.url;

      const tryPlay = () => {
        const playPromise = video.play();
        if (playPromise !== undefined) {
          playPromise.catch(() => {
            video.muted = true;
            video.play().then(() => {
              if (isAuto) {
                overlay.innerHTML = `<div style="text-align:center;color:#fff;">
                  <div style="font-size:28px;margin-bottom:8px;">🔊</div>
                  <div>Нажмите на видео, чтобы включить звук</div>
                </div>`;
                overlay.classList.add('visible');
                overlay.style.pointerEvents = 'auto';
                overlay.onclick = () => {
                  video.muted = false;
                  overlay.classList.remove('visible');
                  overlay.onclick = null;
                };
              }
            }).catch(() => {});
          });
        }
      };

      if (Hls.isSupported() && (url.includes('.m3u8') || url.includes('m3u8') || !url.match(/\.(mp4|mkv|avi|ts)(\?|$)/i))) {
        hls = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
          maxBufferLength: 30,
        });
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          tryPlay();
        });
        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            console.error('HLS error', data);
            overlay.innerHTML = `<div style="text-align:center;color:#e74c3c;">
              <div style="font-size:32px;margin-bottom:8px;">⚠️</div>
              <div>Ошибка воспроизведения</div>
              <div style="font-size:12px;margin-top:6px;opacity:0.7;">Поток недоступен или CORS</div>
            </div>`;
            overlay.classList.add('visible');
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.addEventListener('loadedmetadata', tryPlay, { once: true });
      } else {
        video.src = url;
        video.addEventListener('loadedmetadata', tryPlay, { once: true });
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    document.getElementById('modal').addEventListener('click', (e) => {
      if (e.target.id === 'modal') closeModal();
    });

    init();
  </script>
</body>
</html>
